name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # The four delivery gates, in the order `scc check` runs them locally, so a red
    # pull request fails on the same step the author would have seen first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-groups --locked

      - name: Build
        run: uv build --wheel --out-dir dist

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python scripts/test_gate.py

  artifacts:
    # The specs, plans and knowledge base are graded for shape, not for content.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate artefacts
        run: npx --yes @protonspy/scc validate
