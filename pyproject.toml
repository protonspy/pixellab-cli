[project]
name = "pixellab-cli"
version = "0.6.1"
description = "Generate 2D game assets from PixelLab and concept art from fal, from one command line."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["pixel-art", "game-assets", "pixellab", "fal", "sprites", "tilesets", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pillow>=11.0",
    "fal-client>=0.5",
]

[project.scripts]
# `pixellab` on PyPI is PixelLab's own SDK and ships a script of that name, so this
# one carries the distribution's name rather than shadowing theirs.
pixellab-cli = "pixellab_cli.cli:app"

[project.urls]
Homepage = "https://github.com/protonspy/pixellab-cli"
Repository = "https://github.com/protonspy/pixellab-cli"
Issues = "https://github.com/protonspy/pixellab-cli/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# An allowlist rather than whatever git happens to track: an sdist goes to PyPI and
# cannot be recalled, so what travels in it is a decision. Tests and the vendored
# schemas are here because the suite is runnable from the sdist alone.
include = [
    "src/pixellab_cli",
    "tests",
    "reference",
    "scripts",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pixellab_cli"]
# The skill ships inside the wheel: `pixellab setup` installs it into whichever
# harness the person uses, and an installed CLI has no repository to copy it from.
artifacts = ["src/pixellab_cli/skill/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/pixellab_cli"]
branch = true
# `python -m pixellab_cli` is three lines that call the same app object the console
# script does; the console script is what the tests drive.
omit = ["src/pixellab_cli/__main__.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# `ref/` holds other people's repositories, checked out for reading, not for linting.
extend-exclude = ["ref", ".codegraph", "docs", "specs", "plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# typer declares options as argument defaults; that is the library's idiom, not the
# mutable-default bug B008 exists to catch.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
